<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BptProto Docs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=Vazirmatn:wght@400;500;700;800&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
:root{--acc:#4f46e5;--acc-2:#6d63ff;--bg:#fff;--bg2:#f7f7fb;--ink:#1c1c28;--mute:#6b6b80;--line:#e8e8f0;--code:#14141f;--code-line:#ffffff1a;
--k:#c4a2ff;--s:#8fe3a8;--n:#ffb98a;--c:#6f7590;--f:#7cc4ff;
--sans:"Instrument Sans","Vazirmatn",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--acc:#8b85ff;--acc-2:#a29dff;--bg:#0e0e16;--bg2:#15151f;--ink:#ececf5;--mute:#9494aa;--line:#24243a;--code:#08080e}}
:root[data-theme="dark"]{--acc:#8b85ff;--acc-2:#a29dff;--bg:#0e0e16;--bg2:#15151f;--ink:#ececf5;--mute:#9494aa;--line:#24243a;--code:#08080e}
html{scroll-padding-top:calc(80px + env(safe-area-inset-top,0px));scroll-behavior:smooth}
html[lang=fa]{--sans:"Vazirmatn","Instrument Sans",system-ui,sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.85 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
a{color:var(--acc)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;height:64px;display:flex;align-items:center;gap:14px;padding:0 24px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:10px;font:700 19px var(--sans);color:var(--ink);text-decoration:none;direction:ltr;letter-spacing:-.02em}
.logo i{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc-2));display:grid;place-items:center;color:#fff;font:700 15px var(--mono);font-style:normal}
.ver{font:500 12px var(--mono);color:var(--mute);border:1px solid var(--line);border-radius:99px;padding:1px 9px;direction:ltr}
.sp{flex:1}
.srch{display:flex;align-items:center;gap:10px;min-width:260px;padding:7px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg2);color:var(--mute);font-size:14px}
.srch:hover{border-color:var(--acc)}
.srch kbd{margin-inline-start:auto;font:11px var(--mono);border:1px solid var(--line);border-radius:5px;padding:0 6px;background:var(--bg)}
.ib{border:1px solid var(--line);background:transparent;border-radius:10px;height:36px;min-width:36px;padding:0 11px;font-size:14px}
.ib:hover{border-color:var(--acc);color:var(--acc)}
#menu{display:none}
.wrap{display:grid;grid-template-columns:270px minmax(0,1fr) 220px;max-width:1360px;margin:0 auto}
nav#nav{position:sticky;top:64px;align-self:start;height:calc(100vh - 64px);overflow:auto;padding:28px 20px 40px 16px;border-inline-end:1px solid var(--line)}
nav h4{margin:22px 0 6px;padding:0 12px;font:700 14px var(--sans)}
nav h4:first-child{margin-top:0}
nav a{display:block;padding:5px 12px;margin:1px 0;border-radius:8px;color:var(--mute);text-decoration:none;font-size:14.5px}
nav a:hover{color:var(--ink);background:var(--bg2)}
nav a.on{color:var(--acc);background:color-mix(in srgb,var(--acc) 11%,transparent);font-weight:600}
main{padding:44px 48px 90px;min-width:0}
article{max-width:740px;margin:0 auto}
.crumb{color:var(--acc);font-weight:600;font-size:14px;margin-bottom:6px}
h1{font-size:2.6rem;line-height:1.25;margin:0 0 .5rem;letter-spacing:-.03em;font-weight:700}
h2{font-size:1.55rem;margin:2.4em 0 .5em;padding-top:1.2em;border-top:1px solid var(--line);letter-spacing:-.02em;position:relative}
h3{font-size:1.15rem;margin:1.8em 0 .4em;font-family:var(--mono);font-weight:500}
.ha{position:absolute;inset-inline-start:-1.2em;color:var(--mute);text-decoration:none;opacity:0;font-weight:400}
h2:hover .ha,h3:hover .ha{opacity:1}
p,li{max-width:68ch}
li{margin:.3em 0}
.lead{font-size:1.2rem;color:var(--mute);line-height:1.8}
code{font-family:var(--mono);font-size:.86em;background:var(--bg2);border:1px solid var(--line);padding:1px 6px;border-radius:6px;direction:ltr;unicode-bidi:embed}
.cb{margin:1.5em 0;border-radius:14px;background:var(--code);overflow:hidden;direction:ltr;box-shadow:0 10px 30px -14px #0006}
.cbh{display:flex;align-items:center;gap:2px;padding:0 8px 0 16px;height:42px;border-bottom:1px solid var(--code-line);color:#8b90ab;font:12px var(--mono)}
.cbh .t{flex:1}
.cbh button{background:none;border:0;height:42px;padding:0 12px;color:#8b90ab;font:12px var(--mono);border-bottom:2px solid transparent}
.cbh button:hover{color:#fff}
.cbh button.on{color:#fff;border-bottom-color:var(--acc-2)}
.cbh .cp{height:28px;border-radius:7px;border:1px solid var(--code-line)}
pre{margin:0;padding:18px 20px;overflow-x:auto;color:#dfe3f5;font:13.5px/1.75 var(--mono);text-align:left;tab-size:2}
pre code{all:unset}
.k{color:var(--k)}.s{color:var(--s)}.n{color:var(--n)}.c{color:var(--c);font-style:italic}.f{color:var(--f)}
.note{margin:1.5em 0;padding:14px 18px;border-radius:12px;border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);background:color-mix(in srgb,var(--acc) 7%,transparent)}
.note b{display:block;font-size:13px;color:var(--acc);margin-bottom:2px}
.note.tip{--acc:#0f9d6b;--acc-2:#0f9d6b}
.note.warn{--acc:#d97706;--acc-2:#d97706}
.note p{margin:0}
.tw{overflow-x:auto;margin:1.5em 0;border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{padding:10px 16px;text-align:start;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border:0}
th{background:var(--bg2);font-weight:600;font-size:13px}
td:first-child{font-family:var(--mono);direction:ltr;text-align:left;white-space:nowrap;color:var(--acc)}
.pn{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:4em}
.pn a{padding:16px 20px;border:1px solid var(--line);border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600}
.pn a:hover{border-color:var(--acc);background:var(--bg2)}
.pn a:last-child{text-align:end}
.pn small{display:block;color:var(--mute);font-weight:400;font-size:13px}
aside#toc{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 64px);overflow:auto;padding:44px 16px 20px 8px;font-size:13.5px}
aside h5{margin:0 0 10px;font-size:13px}
aside a{display:block;padding:3px 12px;color:var(--mute);text-decoration:none;border-inline-start:2px solid var(--line);line-height:1.6;margin-bottom:2px}
aside a.l3{padding-inline-start:24px}
aside a:hover{color:var(--ink)}
aside a.on{color:var(--acc);border-inline-start-color:var(--acc);font-weight:600}
#modal{position:fixed;inset:0;z-index:50;background:#0008;display:none;align-items:flex-start;justify-content:center;padding:12vh 16px 0}
#modal.open{display:flex}
.mb{width:100%;max-width:560px;background:var(--bg);border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 30px 80px -20px #0009}
.mb input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:16px 20px;font:16px var(--sans);outline:0}
.res{max-height:50vh;overflow:auto;padding:8px}
.res a{display:block;padding:9px 14px;border-radius:9px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.5}
.res a small{display:block;color:var(--mute);font-size:12.5px}
.res a.on{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.res p{padding:18px;color:var(--mute);margin:0;text-align:center}
@media(max-width:1100px){.wrap{grid-template-columns:270px minmax(0,1fr)}aside#toc{display:none}}
@media(max-width:820px){.wrap{display:block}#menu{display:inline-block}.srch{min-width:0}.srch span,.srch kbd,.ver{display:none}header{padding:0 14px}
nav#nav{display:none;position:fixed;top:calc(64px + env(safe-area-inset-top,0px));inset-inline:0;bottom:0;height:auto;background:var(--bg);z-index:15}
nav#nav.open{display:block}main{padding:28px 18px 70px}h1{font-size:2rem}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}

body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(60% 40% at 50% -5%,color-mix(in srgb,var(--acc) 22%,transparent),transparent 70%),linear-gradient(var(--bg),var(--bg))}
body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;opacity:.5;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(70% 45% at 50% 0,#000,transparent);mask-image:radial-gradient(70% 45% at 50% 0,#000,transparent)}
header{border-bottom-color:transparent;box-shadow:0 1px 0 var(--line)}
.srch{background:color-mix(in srgb,var(--bg2) 80%,transparent);border-radius:12px}
nav#nav{border-inline-end:0}
nav a{position:relative;border-radius:10px}
nav a.on{background:color-mix(in srgb,var(--acc) 12%,transparent)}
nav a.on::before{content:"";position:absolute;inset-inline-start:-2px;top:22%;bottom:22%;width:3px;border-radius:3px;background:var(--acc)}
h2{border-top:0;padding-top:.4em}
.cb{border:1px solid var(--code-line);box-shadow:0 24px 60px -28px color-mix(in srgb,var(--acc) 55%,#000)}
.cbh::before{content:"";width:10px;height:10px;border-radius:50%;background:#ff5f57;box-shadow:16px 0 0 #febc2e,32px 0 0 #28c840;margin-inline-end:52px}
.note{border-radius:14px;border-inline-start:3px solid var(--acc)}
.hero{padding:34px 0 8px;animation:rise .7s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.badge{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border:1px solid color-mix(in srgb,var(--acc) 35%,transparent);border-radius:99px;background:color-mix(in srgb,var(--acc) 9%,transparent);color:var(--acc);font-size:13px;font-weight:600}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px color-mix(in srgb,var(--acc) 25%,transparent)}
.hero h1{font-size:clamp(2.4rem,6.5vw,4.2rem);line-height:1.15;margin:18px 0 14px;letter-spacing:-.045em;font-weight:800;background:linear-gradient(120deg,var(--ink) 30%,var(--acc) 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .lead{max-width:56ch;margin:0 0 26px}
.acts{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-bottom:34px}
.btn{display:inline-flex;align-items:center;height:46px;padding:0 24px;border-radius:12px;font-weight:600;text-decoration:none;border:1px solid var(--line);color:var(--ink);background:var(--bg2)}
.btn:hover{border-color:var(--acc)}
.btn.p{background:linear-gradient(135deg,var(--acc),var(--acc-2));color:#fff;border-color:transparent;box-shadow:0 12px 28px -10px var(--acc)}
.btn.p:hover{filter:brightness(1.08)}
.cmd{display:inline-flex;align-items:center;gap:12px;height:46px;padding:0 8px 0 18px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);font:14px var(--mono);direction:ltr;cursor:pointer;color:var(--ink)}
.cmd:hover{border-color:var(--acc)}
.cmd em{font-style:normal;color:var(--mute);font:12px var(--mono);padding:4px 10px;border-radius:7px;background:var(--bg)}
.hero .cb{margin:0}
.hero pre{min-height:260px}
.caret{display:inline-block;width:8px;height:1.1em;vertical-align:text-bottom;background:var(--acc-2);animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin:34px 0}
.card{padding:22px;border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,color-mix(in srgb,var(--bg2) 90%,transparent),transparent);transition:border-color .2s,transform .2s}
.card:hover{border-color:var(--acc);transform:translateY(-3px)}
.card i{display:grid;place-items:center;width:38px;height:38px;border-radius:11px;margin-bottom:14px;font:600 18px var(--mono);font-style:normal;color:#fff;background:linear-gradient(135deg,var(--acc),var(--acc-2))}
.card b{display:block;font-size:16px;margin-bottom:4px}
.card span{color:var(--mute);font-size:14.5px;line-height:1.7;display:block}
article.wide{max-width:900px}
@media(prefers-reduced-motion:reduce){.hero{animation:none}.caret{animation:none}.card{transition:none}}

.steps{margin:1.8em 0}
.st{display:grid;grid-template-columns:44px minmax(0,1fr);gap:18px;position:relative;padding-bottom:28px}
.st:not(:last-child)::before{content:"";position:absolute;inset-inline-start:21px;top:46px;bottom:2px;width:2px;background:linear-gradient(var(--acc),var(--line))}
.st .n{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font:600 16px var(--mono);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);background:color-mix(in srgb,var(--acc) 10%,var(--bg))}
.st h4{margin:8px 0 2px;font-size:1.08rem;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.st p{margin:0 0 6px;color:var(--mute)}
.st .cb{margin:12px 0 0}
.mod{font:500 12px var(--mono);color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 30%,transparent);background:color-mix(in srgb,var(--acc) 8%,transparent);border-radius:7px;padding:1px 8px;direction:ltr}
.layers{margin:1.8em 0;display:flex;flex-direction:column}
.ly{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:16px 20px;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--acc) var(--m),var(--bg2));position:relative}
.ly b{display:block;font-size:1.02rem}
.ly span{color:var(--mute);font-size:14.5px}
.ly:not(:last-child){margin-bottom:22px}
.ly:not(:last-child)::after{content:"↓";position:absolute;left:50%;bottom:-24px;transform:translateX(-50%);color:var(--acc);font:600 16px var(--mono);line-height:22px}
@media(max-width:620px){.ly{flex-direction:column;align-items:flex-start;gap:6px}}
.flow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:1.4em 0}
.flow .chip{padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:var(--bg2);font:500 13px var(--mono);direction:ltr}
.flow .chip.a{border-color:var(--acc);color:var(--acc);background:color-mix(in srgb,var(--acc) 10%,transparent)}
.flow s{text-decoration:none;color:var(--mute);font-family:var(--mono)}
</style>
</head>
<body>
<header>
  <button id="menu" class="ib" aria-label="menu">☰</button>
  <a class="logo" href="#/"><i>B</i>BptProto</a><span class="ver" id="ver"></span>
  <span class="sp"></span>
  <button class="srch" id="sbtn"><span>⌕</span><span id="sph"></span><kbd>Ctrl K</kbd></button>
  <button class="ib" id="lang"></button>
  <button class="ib" id="theme" aria-label="theme"></button>
</header>
<div class="wrap"><nav id="nav"></nav><main><article id="page"></article></main><aside id="toc"></aside></div>
<div id="modal"><div class="mb"><input id="q" autocomplete="off"><div class="res" id="res"></div></div></div>

<!--
  ═══ CONFIG / کانفیگ ═══
  Only edit this JSON to add docs. / برای افزودن مستندات فقط همین JSON را ویرایش کن.
  Text: "string" or {"fa":"...","en":"..."}
  Blocks: h2 | h3 | p | list | code | tabs | note (kind: note|tip|warn) | table
  Inline `code` in text becomes <code>.
-->

<script>
(function(){
var cfg = null;
var $ = function(id){return document.getElementById(id)};
var st = function(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
var lang = st('bpt-lang') || ((navigator.language||'').slice(0,2)==='fa'?'fa':'en');
var theme = st('bpt-theme');
var UI = {
 fa:{lang:'English',prev:'قبلی',next:'بعدی',copy:'کپی',done:'کپی شد',search:'جستجو در مستندات…',none:'نتیجه‌ای پیدا نشد',toc:'در این صفحه',note:'نکته',tip:'راهنما',warn:'هشدار'},
 en:{lang:'فارسی',prev:'Previous',next:'Next',copy:'Copy',done:'Copied',search:'Search docs…',none:'No results',toc:'On this page',note:'Note',tip:'Tip',warn:'Warning'}};
var KW = 'def|class|return|import|from|await|async|const|let|var|function|if|else|for|while|new|true|false|None|null|True|False|self|this|export|require|git|cd|pip|npm|install';
var HL = new RegExp('(#.*|//.*)|("(?:\\\\.|[^"\\\\])*"|\'(?:\\\\.|[^\'\\\\])*\')|\\b(\\d+)\\b|\\b('+KW+')\\b|(\\b[A-Za-z_]\\w*)(?=\\()','g');
function T(x){return x==null?'':typeof x==='string'?x:(x[lang]||x.en||x.fa||'')}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function inl(s){return esc(T(s)).replace(/`([^`]+)`/g,'<code>$1</code>')}
function hl(code){var o='',i=0,m;HL.lastIndex=0;
 while((m=HL.exec(code))){o+=esc(code.slice(i,m.index));var c=m[1]?'c':m[2]?'s':m[3]?'n':m[4]?'k':'f';o+='<span class="'+c+'">'+esc(m[0])+'</span>';i=HL.lastIndex}
 return o+esc(code.slice(i))}
function slug(s){return String(s).toLowerCase().replace(/[^\w\u0600-\u06ff]+/g,'-').replace(/^-|-$/g,'')||'x'}

var flat=[];
function initFlat(){flat=[];cfg.sections.forEach(function(s){s.pages.forEach(function(p){p._sec=s.title;flat.push(p)})})}

function codeBox(items,title){
 var tabs=items.length>1?items.map(function(it,i){return '<button data-tab="'+i+'" class="'+(i?'':'on')+'">'+esc(it.label)+'</button>'}).join(''):'';
 var t=esc(title||(items.length===1?items[0].lang||'':''));
 return '<div class="cb"><div class="cbh">'+tabs+'<span class="t">'+(items.length>1?'':t)+'</span>'+'<button class="cp" data-copy>'+UI[lang].copy+'</button></div>'+
 items.map(function(it,i){return '<pre data-i="'+i+'"'+(i?' hidden':'')+'><code>'+hl(it.code)+'</code></pre>'}).join('')+'</div>'}

function block(b){switch(b.t){
 case 'h2':case 'h3':var id=slug(T(b.text));return '<'+b.t+' id="'+id+'"><a class="ha" href="#" data-a="'+id+'">#</a>'+inl(b.text)+'</'+b.t+'>';
 case 'p':return '<p'+(b.lead?' class="lead"':'')+'>'+inl(b.text)+'</p>';
 case 'list':return '<ul>'+b.items.map(function(i){return '<li>'+inl(i)+'</li>'}).join('')+'</ul>';
 case 'note':var k=b.kind==='warning'?'warn':(b.kind||'note');return '<div class="note '+k+'"><b>'+UI[lang][k]+'</b><p>'+inl(b.text)+'</p></div>';
 case 'code':return codeBox([{code:b.code,lang:b.lang}],b.title);
 case 'tabs':return codeBox(b.items,b.title);
 case 'hero':return '<section class="hero"><span class="badge">'+inl(b.badge)+'</span><h1>'+inl(b.title)+'</h1><p class="lead">'+inl(b.sub)+'</p><div class="acts"><a class="btn p" href="'+b.primary.href+'">'+inl(b.primary.label)+'</a>'+(b.secondary?'<a class="btn" target="_blank" rel="noopener" href="'+b.secondary.href+'">'+inl(b.secondary.label)+'</a>':'')+'<button class="cmd" data-cmd="'+esc(b.cmd)+'"><span>$ '+esc(b.cmd)+'</span><em>'+UI[lang].copy+'</em></button></div><div class="cb"><div class="cbh"><span class="t">'+esc(b.file||'')+'</span></div><pre><code id="ty" data-full="'+esc(b.code).replace(/"/g,'&quot;')+'"></code></pre></div></section>';
 case 'steps':return '<div class="steps">'+b.items.map(function(x,i){return '<div class="st"><div class="n">'+(i+1)+'</div><div><h4>'+inl(x.title)+(x.module?'<span class="mod">'+esc(x.module)+'</span>':'')+'</h4><p>'+inl(x.text)+'</p>'+(x.code?codeBox([{code:x.code,lang:x.lang||'python'}],x.file):'')+'</div></div>'}).join('')+'</div>';
 case 'layers':return '<div class="layers">'+b.items.map(function(x,i){return '<div class="ly" style="--m:'+Math.max(4,22-i*4)+'%"><div><b>'+inl(x.name)+'</b><span>'+inl(x.text)+'</span></div>'+(x.module?'<span class="mod">'+esc(x.module)+'</span>':'')+'</div>'}).join('')+'</div>';
 case 'flow':return '<div class="flow">'+b.items.map(function(x,i){return (i?'<s>'+(lang==='fa'?'←':'→')+'</s>':'')+'<span class="chip'+(x.a?' a':'')+'">'+esc(x.label||x)+'</span>'}).join('')+'</div>';
 case 'cards':return '<div class="cards">'+b.items.map(function(c){return '<div class="card"><i>'+esc(c.icon||'•')+'</i><b>'+inl(c.title)+'</b><span>'+inl(c.text)+'</span></div>'}).join('')+'</div>';
 case 'table':return '<div class="tw"><table><thead><tr>'+b.head.map(function(h){return '<th>'+inl(h)+'</th>'}).join('')+'</tr></thead><tbody>'+b.rows.map(function(r){return '<tr>'+r.map(function(c){return '<td>'+inl(c)+'</td>'}).join('')+'</tr>'}).join('')+'</tbody></table></div>'}
 return ''}

var spy=null;
function route(){
 var id=location.hash.replace(/^#\/?/,'')||flat[0].id;
 var i=flat.findIndex(function(p){return p.id===id});if(i<0)i=0;var p=flat[i];
 var html=(p.hero?'':'<div class="crumb">'+esc(T(p._sec))+'</div><h1>'+inl(p.title)+'</h1>')+p.blocks.map(block).join('');
 $('page').className=p.hero?'wide':'';
 var pv=flat[i-1],nx=flat[i+1];
 html+='<div class="pn">'+(pv?'<a href="#/'+pv.id+'"><small>'+UI[lang].prev+'</small>'+inl(pv.title)+'</a>':'<span></span>')+(nx?'<a href="#/'+nx.id+'"><small>'+UI[lang].next+'</small>'+inl(nx.title)+'</a>':'<span></span>')+'</div>';
 $('page').innerHTML=html;
 document.title=T(p.title)+' · '+cfg.name;
 document.querySelectorAll('#nav a').forEach(function(a){a.classList.toggle('on',a.getAttribute('href')==='#/'+p.id)});
 $('nav').classList.remove('open');
 var hs=[].slice.call($('page').querySelectorAll('h2,h3'));
 $('toc').innerHTML=hs.length?'<h5>'+UI[lang].toc+'</h5>'+hs.map(function(h){return '<a href="#" data-a="'+h.id+'" class="'+(h.tagName==='H3'?'l3':'')+'">'+esc(h.textContent.replace(/^#/,''))+'</a>'}).join(''):'';
 if(spy)spy.disconnect();
 spy=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){document.querySelectorAll('#toc a').forEach(function(a){a.classList.toggle('on',a.dataset.a===e.target.id)})}})},{rootMargin:'-80px 0px -70% 0px'});
 hs.forEach(function(h){spy.observe(h)});
 window.scrollTo(0,0);typeIt()}
var tyT=null;
function typeIt(){clearInterval(tyT);var el=$('ty');if(!el)return;var full=el.dataset.full,n=0;
 if(matchMedia('(prefers-reduced-motion: reduce)').matches){el.innerHTML=hl(full);return}
 tyT=setInterval(function(){n+=2;if(n>=full.length){clearInterval(tyT);el.innerHTML=hl(full)+'<span class="caret"></span>';return}
  el.innerHTML=hl(full.slice(0,n))+'<span class="caret"></span>'},22)}

function build(){
 document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';
 $('ver').textContent='v'+cfg.version;$('lang').textContent=UI[lang].lang;$('sph').textContent=UI[lang].search;$('q').placeholder=UI[lang].search;
 $('nav').innerHTML=cfg.sections.map(function(s){return '<h4>'+esc(T(s.title))+'</h4>'+s.pages.map(function(p){return '<a href="#/'+p.id+'">'+esc(T(p.title))+'</a>'}).join('')}).join('');
 route()}

function applyTheme(){
 if(theme)document.documentElement.setAttribute('data-theme',theme);else document.documentElement.removeAttribute('data-theme');
 var d=theme==='dark'||(!theme&&matchMedia('(prefers-color-scheme: dark)').matches);$('theme').textContent=d?'☀':'☾'}

/* search */
var sel=0,hits=[];
function index(){var r=[];flat.forEach(function(p){r.push({t:T(p.title),s:T(p._sec),h:'#/'+p.id,k:T(p.title)});
 p.blocks.forEach(function(b){if(b.t==='h2'||b.t==='h3')r.push({t:T(b.text),s:T(p.title),h:'#/'+p.id,a:slug(T(b.text)),k:T(b.text)});
  else if(b.t==='p'&&b.text)r.push({t:T(p.title),s:T(b.text).slice(0,70),h:'#/'+p.id,k:T(b.text)})})});return r}
function find(){var q=$('q').value.trim().toLowerCase(),ix=index();
 hits=q?ix.filter(function(x){return (x.k+' '+x.t).toLowerCase().indexOf(q)>-1}).slice(0,8):ix.filter(function(x){return !x.a&&x.s.length<40}).slice(0,8);
 sel=0;draw()}
function draw(){$('res').innerHTML=hits.length?hits.map(function(h,i){return '<a href="'+h.h+'" data-a="'+(h.a||'')+'" class="'+(i===sel?'on':'')+'">'+esc(h.t)+'<small>'+esc(h.s)+'</small></a>'}).join(''):'<p>'+UI[lang].none+'</p>'}
function openS(){$('modal').classList.add('open');$('q').value='';find();$('q').focus()}
function closeS(){$('modal').classList.remove('open')}
function go(a){closeS();if(!a)return;location.hash=a.getAttribute('href');if(a.dataset.a)setTimeout(function(){var e=$(a.dataset.a);e&&e.scrollIntoView()},60)}

$('sbtn').onclick=openS;
$('modal').onclick=function(e){if(e.target===this)closeS()};
$('q').oninput=find;
$('res').onclick=function(e){var a=e.target.closest('a');if(a){e.preventDefault();go(a)}};
document.addEventListener('keydown',function(e){
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openS()}
 else if(e.key==='Escape')closeS();
 else if($('modal').classList.contains('open')&&hits.length){
  if(e.key==='ArrowDown'){e.preventDefault();sel=(sel+1)%hits.length;draw()}
  else if(e.key==='ArrowUp'){e.preventDefault();sel=(sel-1+hits.length)%hits.length;draw()}
  else if(e.key==='Enter'){e.preventDefault();go($('res').children[sel])}}});
$('lang').onclick=function(){lang=lang==='fa'?'en':'fa';st('bpt-lang',lang);build()};
$('theme').onclick=function(){var d=theme==='dark'||(!theme&&matchMedia('(prefers-color-scheme: dark)').matches);theme=d?'light':'dark';st('bpt-theme',theme);applyTheme()};
$('menu').onclick=function(){$('nav').classList.toggle('open')};
window.addEventListener('hashchange',route);
document.addEventListener('click',function(e){
 var an=e.target.closest('[data-a]');
 if(an&&!an.closest('.res')){e.preventDefault();var t=$(an.dataset.a);if(t){t.scrollIntoView()}return}
 var cm=e.target.closest('[data-cmd]');
 if(cm){try{navigator.clipboard.writeText(cm.dataset.cmd)}catch(err){}var em=cm.querySelector('em');em.textContent=UI[lang].done;setTimeout(function(){em.textContent=UI[lang].copy},1200);return}
 var b=e.target.closest('button');if(!b)return;var box=b.closest('.cb');if(!box)return;
 if(b.dataset.tab!==undefined){
  box.querySelectorAll('.cbh button[data-tab]').forEach(function(x){x.classList.toggle('on',x===b)});
  box.querySelectorAll('pre').forEach(function(p){p.hidden=p.dataset.i!==b.dataset.tab})}
 else if(b.dataset.copy!==undefined){
  var pre=box.querySelector('pre:not([hidden])');try{navigator.clipboard.writeText(pre.textContent)}catch(err){}
  b.textContent=UI[lang].done;setTimeout(function(){b.textContent=UI[lang].copy},1200)}});
function boot(c){cfg=c;initFlat();applyTheme();build();}
fetch('docs.json').then(function(r){if(!r.ok)throw r.status;return r.json()}).then(boot).catch(function(e){
 document.body.innerHTML='<div style="max-width:560px;margin:20vh auto;padding:32px;font-family:system-ui;text-align:center"><h2>Could not load docs.json</h2><p>Serve this folder over HTTP, e.g. <code>php -S localhost:8000 -t docs</code></p></div>';
});
})();
</script>
</body>
</html>
